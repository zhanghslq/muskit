spring:
  application:
    name: muskit-example
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:h2:mem:muskit;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

muskit:
  context:
    enabled: true
    task-decorator-enabled: true
  concurrency:
    enabled: true
    policies:
      tenant-export:
        max-concurrency: 2
        max-wait: 200ms
        scope: key
        fair: false
  lock:
    enabled: true
    key-prefix: "muskit:lock:"
  idempotency:
    enabled: true
    provider: redis
    redis-key-prefix: "muskit:idempotency:"
    lease-renewal-enabled: true
  observability:
    enabled: true
    endpoint-enabled: true
  lifecycle:
    shutdown-timeout: 30s
  executor:
    executors:
      default:
        type: virtual
        max-concurrency: 100
        queue-capacity: 200
        shutdown-timeout: 30s
  inbox:
    provider: jdbc
    initialize-schema: true
    policies:
      order-consumer:
        processing-timeout: 30s
        retention: 7d
        max-attempts: 5
        initial-retry-delay: 1s
        retry-multiplier: 2
        max-retry-delay: 5m
  cache:
    provider: redis
    refresh-executor: default
    policies:
      product:
        ttl: 10m
        null-ttl: 30s
        ttl-jitter-ratio: 0.1
        stale-while-revalidate: 1m
        failure-mode: fail-fast
  client:
    outbound-timeout: 3s
    max-inbound-timeout: 30s
    operation: remote-http
    context-headers:
      tenantId: X-Tenant-Id
  audit:
    provider: jdbc
    table-name: muskit_audit
    failure-mode: fail-fast
  state:
    max-conflict-retries: 3
  resilience:
    rate-limit-enabled: true
    rate-limit-provider: redis
    redis-rate-limit-key-prefix: "muskit:rate-limit:"
    rate-limit-policies:
      order-submit:
        capacity: 5
        refill-tokens: 5
        refill-period: 1s
        scope: key
    retry-policies:
      remote-payment:
        max-attempts: 3
        initial-delay: 100ms
        multiplier: 2
        max-delay: 1s
        jitter: 0.2
    circuit-breaker-policies:
      remote-payment:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 20
        wait-duration-in-open-state: 30s
  outbox:
    enabled: true
    initialize-schema: true
    require-transaction: true
    batch-size: 100
    lease-time: 30s
    retry-delay: 5s
    max-attempts: 10
    retry-multiplier: 2
    max-retry-delay: 5m
    poll-interval: 1s
    published-retention: 7d

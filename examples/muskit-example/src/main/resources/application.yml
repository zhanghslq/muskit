spring:
  application:
    name: muskit-example
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

muskit:
  context:
    enabled: true
    task-decorator-enabled: true
  concurrency:
    enabled: true
    policies:
      tenant-export:
        max-concurrency: 2
        max-wait: 200ms
        scope: key
        fair: false
  lock:
    enabled: true
    key-prefix: "muskit:lock:"
  idempotency:
    enabled: true
    provider: redis
    redis-key-prefix: "muskit:idempotency:"
  resilience:
    rate-limit-enabled: true
    rate-limit-policies:
      order-submit:
        capacity: 5
        refill-tokens: 5
        refill-period: 1s
        scope: key
